<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jeonc의 개발홈</title>
<meta name="description" content="이곳은 jeonc가 개발하며 노는 공간입니다.">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; margin: 0; background: #fff; color: #222; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
  main { min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center; text-align: center; padding: 50px 20px; }
  h1 { font-size: clamp(2.2rem, 8vw, 3.6rem); line-height: 1.2; margin: 0; align-self: start; letter-spacing: -0.02em; }
  p { font-size: 1.15rem; color: #666; margin: 24px 0; }
  .btn { align-self: end; display: inline-block; padding: 14px 32px; border-radius: 999px; font-weight: 600; font-size: 1.05rem; background: #1a5fb4; color: #fff; text-decoration: none; transition: transform .15s, filter .15s; }
  .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
</style>
</head>

<main>
